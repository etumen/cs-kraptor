name: NetShort v1 probe

on:
  push:
    branches:
      - feat/netshort-v1
    paths:
      - "NetShort/**"
      - "netshort-lab/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradle/wrapper/**"
      - ".github/workflows/netshort-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify NetShort direct public contract
        run: python3 netshort-lab/probe_netshort.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.2.0"

      - name: Build NetShort cs3
        run: |
          gradle :NetShort:make --stacktrace --no-daemon
          find NetShort/build -maxdepth 5 -type f -print

      - name: Upload NetShort cs3
        uses: actions/upload-artifact@v4
        with:
          name: netshort-v1-cs3
          path: NetShort/build/**/*.cs3
          if-no-files-found: error
