name: NetShort v1 probe

on:
  push:
    branches:
      - feat/netshort-v1
    paths:
      - "netshort-lab/**"
      - ".github/workflows/netshort-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe NetShort public web contract
        run: python3 netshort-lab/probe_netshort.py
